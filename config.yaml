# =============================================================================
# HBS AI Institute — Multi-Agent Content Command Center
# Master Configuration
# =============================================================================
# This file is the single source of truth for model assignment, cost
# governance, integrations, and the agent roster. Directors and the Chief
# of Staff read this file at boot — do not hardcode model names elsewhere.

system:
  name: "HBS AI Institute Content Command Center"
  version: "1.2.0"
  owner: "Instructional Designer & AI Product Manager, HBS AI Institute"
  architecture: "hub-and-spoke"
  communication_rule: >
    Directors never communicate with each other. Every request enters
    through the Chief of Staff (the hub), is dispatched in parallel to one
    or more Directors (the spokes), and every Director's output returns
    only to the Chief of Staff for synthesis before reaching the user.
  naming_convention: >
    Every hub-and-spoke role carries a real Harvard namesake alongside its
    functional title, chosen to fit what the role does — never merely
    decorative, and never a contested or living figure. The two hub-level
    roles (Chief of Staff, Memory Curator) take UNIVERSITY-wide figures,
    since they coordinate across everything below them; the twelve Directors
    take HBS-specific figures, since each owns one bounded domain. One
    Director (Accessibility & Compliance) intentionally carries no
    namesake — UDL/WCAG are modern frameworks with no real historical
    figure behind them, and forcing one on would trivialize it.

# -----------------------------------------------------------------------------
# OPERATING MODES
# -----------------------------------------------------------------------------
# Two independent ways this system can run. They share config.yaml,
# memory/, qa_logs/, and pipelines/ — they are not separate systems.
operating_mode:
  default: interactive

  interactive:
    description: >
      The primary, current mode. You talk directly to the Chief of Staff in
      a live Claude Code chat session. Claude embodies the hub: it reads
      this file as its operating contract, routes to Director personas by
      their system prompts (agents/directors/), calls connector-based tools
      (Lovable, ElevenLabs, Granola, Notion) LIVE when they're connected,
      and asks you directly in conversation before anything cost-bearing or
      externally-published — no stdin prompts, no scripts running unattended.
    requires: "An active chat session — nothing runs when you're not here."

  unattended:
    enabled: false
    description: >
      The standalone Python system (main.py, agents/chief_of_staff.py) is
      fully built and can run headless (cron, GitHub Actions, etc.) reading
      API keys from .env instead of live chat connectors. It stays OFF
      until you deliberately turn it on.
    how_to_request: >
      To queue a specific task for unattended execution without enabling
      the whole system: ask the Chief of Staff to
      `pipelines.pipeline_tracker.PipelineTracker.queue_unattended_request()`.
      This logs the request with status "Queued — unattended mode disabled"
      and executes nothing until you explicitly flip `enabled: true` here
      (or run `main.py` yourself with a human at the keyboard to answer
      each HITL prompt, which is attended, not unattended).
    never_auto_enables: >
      No Director, no HITL "yes", and no connector action may flip this
      flag. Only you, editing this file (or asking Claude to, with an
      explicit instruction naming unattended mode), turns it on.

# -----------------------------------------------------------------------------
# COST & MODEL GOVERNANCE GUARDRAIL
# -----------------------------------------------------------------------------
# Rule: every routine must resolve to a free-tier / subscription-included
# model. If a task requires a model or tool outside this list, the system
# MUST raise a PaidTierRequiredError and route to a HITL checkpoint instead
# of silently spending money.
model_governance:
  enforce_free_tier_only: true
  default_provider: "anthropic_pro"

  approved_free_tier_models:
    anthropic_pro:
      # CORRECTION (was mislabeled): these model IDs are what the
      # STANDALONE SCRIPT calls via ANTHROPIC_API_KEY and the `anthropic`
      # Python SDK — that is Anthropic's metered, pay-per-token Developer
      # API (console.anthropic.com billing), NOT covered by a claude.ai
      # Pro/Max seat. A Pro/Max subscription has no portable API key at
      # all. Talking to Eliot in a live Claude Code chat, and using The
      # Docket's `sample` capability, both use your existing Claude
      # access directly and need NO key here — this section only matters
      # if you deliberately want the standalone script to make real
      # (billed) calls instead of its default offline stub responses.
      chat: "claude-sonnet-5"
      fast: "claude-haiku-4-5-20251001"
      reasoning: "claude-opus-5"
    google_ai_studio:
      # Genuinely free: aistudio.google.com/apikey issues a rate-limited
      # key with no billing attached unless you separately enable billing.
      chat: "gemini-2.5-flash"
      research: "gemini-2.5-pro"
    perplexity:
      # NOT reliably free: Perplexity's API is a metered product.
      # Perplexity Pro has historically included a small monthly API
      # credit, but that's a Perplexity policy that can change — verify
      # current terms on their site before assuming any usage is covered.
      search: "sonar"
      deep_research: "sonar-reasoning"

  disallowed_without_hitl_approval:
    - "any model billed per-token outside an included subscription"
    - "any Anthropic/OpenAI/Google model call using a metered pay-as-you-go key"
    - "any third-party paid API (stock footage, paid stock TTS tiers, etc.)"
    - "ElevenLabs generation usage beyond the free character quota"
    - "Veo 3.1 / Google Vids usage beyond included Workspace/AI Studio quota"
    - "any Lovable send_message / create_project call — these spend Lovable
       workspace credits every time, connector or not. Being 'connected'
       is not the same as being free; ask before every build/edit, not
       just the first one."

  escalation_policy:
    # When a Director's task would exceed the free tier, the router pauses
    # and presents exactly this choice to the human (see hitl_checkpoints).
    # Default bias when unsure or when quota/cost is unknown: ask, don't spend.
    default_when_uncertain: "flag_for_manual_upgrade"
    on_paid_tier_required:
      - "keep_free_path"      # degrade gracefully to nearest free-tier option
      - "flag_for_manual_upgrade"  # log the request, do NOT spend, wait on user

# -----------------------------------------------------------------------------
# INTEGRATIONS
# -----------------------------------------------------------------------------
integrations:
  github:
    enabled: true
    purpose: "Persistent memory sync, PR/code sync for Product Management Director"
    repo_env_var: "GITHUB_REPO"          # e.g. "khedderman/hbs"
    token_env_var: "GITHUB_TOKEN"
    memory_path: "memory/long_term"
    fallback: "local_git_commit"          # used when no token is present

  notion:
    enabled: true
    purpose: "Long-term organizational memory, transcripts, context logs"
    access_mode: "api_key"   # unattended path
    token_env_var: "NOTION_API_KEY"
    database_id_env_var: "NOTION_MEMORY_DATABASE_ID"
    chat_connector_status: "connected"  # verified live 2026-09-03 via ListConnectors

  airtable:
    enabled: true
    purpose: "Pipeline & activity tracking (initiatives, tasks, status)"
    token_env_var: "AIRTABLE_API_KEY"
    base_id_env_var: "AIRTABLE_BASE_ID"
    table_env_var: "AIRTABLE_PIPELINE_TABLE"
    chat_connector_status: "never observed connected in this chat (checked 2026-09-03 via ListConnectors) — monday.com is the real, verified live PM tool now; treat Airtable as declared-only until it actually shows connected."

  monday_com:
    enabled: true
    purpose: "Real project/task/board management for the Project Management Director — boards, items, timelines, automations"
    access_mode: "connector_only"
    chat_connector_status: "connected"  # verified live 2026-09-03: ListConnectors + a real get_user_context call (account tier: pro, is_during_trial: true)
    cost_note: >
      Account is currently on a Pro trial. Not a per-call metered cost like
      ElevenLabs, but confirm the trial's actual end date and post-trial
      plan before treating this as a permanent dependency for Taylor's
      workflow — flag as cost_bearing_action if the trial is at risk of
      lapsing mid-use.

  figma:
    enabled: true
    purpose: "Real wireframes, component specs, and design-to-code/code-to-design for the UI/UX Architecture Director"
    access_mode: "connector_only"
    chat_connector_status: "connected"  # verified live 2026-09-03 via a real whoami call
    seat_caveat: >
      whoami reports a "View" seat on the starter tier plan. A View seat
      commonly can only view/comment, not edit or create files — Gropius
      should confirm actual create/edit capability (e.g. attempt
      create_new_file on a scratch file) before promising a real Figma
      build, rather than assuming the connector being "connected" implies
      full edit access.

  gamma:
    enabled: true
    purpose: "Real AI-generated presentations, docs, and social/web pages — an alternative/complement to Canva for the Content Conversion & Production Director"
    access_mode: "connector_only"
    chat_connector_status: "connected"  # verified live 2026-09-03 via a real get_themes call (102 themes returned)
    note: >
      Cannot edit or modify an existing gamma once generated — only create
      new ones. Direct the user to the Gamma editor for refinements rather
      than claiming a follow-up edit is possible here.

  supabase:
    enabled: true
    purpose: "Real database/auth/storage backend — for the Product Management Director's own tooling and architecture work, not learner-facing content"
    access_mode: "connector_only"
    chat_connector_status: "connected"  # verified live 2026-09-03 via a real list_organizations call ("KHedderman's Org")
    cost_note: >
      Creating/running an actual Supabase project can incur real cost
      beyond the free tier — treat project creation, branching, or
      migrations as a cost_bearing_action checkpoint, not a bare read.

  descript:
    enabled: true
    purpose: "Real video/audio editing (edit-by-transcript), publishing, and transcript/timeline export — the real mechanism for Land's video/audio editing and podcast production, replacing the Replicate/HeyGen aspiration"
    access_mode: "connector_only"
    chat_connector_status: "connected"  # verified live 2026-09-03 via a real get_drive_info call
    note: >
      Agent Underlord (Descript's own AI editor) does the actual editing
      when invoked — refer to it by that name to Kaitlyn, since that's
      what she'll see in the Descript app.

  riverside:
    enabled: true
    purpose: "Real podcast/video recording, editing, captioning, branding, export, and social publishing for the Multimedia Production Director"
    access_mode: "connector_only"
    chat_connector_status: "connected"  # Kaitlyn enabled it 2026-09-03; verified live via a real platform_list_studios call ("Kaitlyn Hedderman's Studio")
    real_tools: >
      ~60 tools verified present, spanning: editing (remove_fillers,
      remove_pauses, apply_smart_mutes, set_captions, add_lower_third,
      add_text_overlay, apply_brand, insert_stock_media/music,
      set_color_correction, cut_time_ranges, and more), media upload
      (media_create_media_upload -> upload bytes -> media_finalize_media_upload
      -> media_get_media; requires a client with local filesystem access,
      which this session has), platform reads (list/get studios, projects,
      recordings, edits, transcripts), and real social publishing
      (social_upload_create, social_get_connected_platforms,
      social_get_publishing_guidelines, social_get_upload_status).
    ai_twin_feature: >
      Confirmed real by Kaitlyn's own screenshot 2026-09-03 of
      riverside.com/dashboard/.../avatar — "Create Your AI Twin" (BETA).
      "Your own twin" (from an uploaded recording of Kaitlyn, 2+ min
      continuous speech, good lighting/quiet background) is available now;
      "Synthetic twin" (from a photo or prompt) is labeled "Coming soon" —
      do not treat it as available. This generation step itself was
      checked directly against the full real tool list above and found
      NOT exposed there — no create_avatar/generate_twin tool exists, so
      it is a web-dashboard-only action Kaitlyn must do herself in the
      browser. UNRESOLVED, not yet tested: whether uploading a video via
      media_create_media_upload (which the docs describe as landing in
      the general "Your Media" editing library) also feeds the dedicated
      AI Twin pipeline, or is a separate mechanism entirely — check
      media_create_media_upload's exact input schema for an avatar/twin-
      specific field, and/or test with a real video, before claiming
      either way. Until resolved, say plainly that Kaitlyn likely still
      needs to click "Create Your AI Twin" herself even if Land uploads
      the source video for her.
      Once a Twin video exists as a project asset (by whatever path), all
      the real editing/caption/brand/export/social-publish tools above
      apply to it normally — that part is fully real and connector-driven.

  perplexity:
    enabled: true
    purpose: "Web-grounded research for Market Intelligence Director"
    token_env_var: "PERPLEXITY_API_KEY"

  google_ai_studio:
    enabled: true
    purpose: "NotebookLM/Gemini ingestion for Pedagogical Synthesis Director"
    token_env_var: "GOOGLE_AI_STUDIO_API_KEY"

  granola:
    enabled: true
    purpose: >
      Meeting transcript ingestion for the Memory Curator and Pedagogical
      Synthesis Director (session facilitation notes, student feedback
      captured live, internal planning meetings).
    access_mode: "connector_only"   # no public REST API for personal accounts —
                                      # interactive chat mode only, not available
                                      # to the unattended script
    chat_connector_status: "OAuth-connected, but no usable account behind it — confirmed twice independently: Donham's live test this session got 'Unauthorized: user has not created a Granola account yet', and a separate Cowork session hit the identical error. Do not treat meeting-ingestion as usable until Kaitlyn signs up at granola.ai/mcp-signup."
    workflow: >
      In an interactive chat session, Claude reads a meeting via the
      Granola connector, then hands the transcript to
      MemoryCurator.ingest_external_transcript() so it's curated and
      synced like any other memory entry. Currently blocked at the first
      step — see chat_connector_status above.

  canva:
    enabled: true
    purpose: "Real design generation — decks, infographics, toolkits, one-pagers — for the Content Conversion & Production Director"
    access_mode: "connector_only"
    chat_connector_status: "connected"  # verified live 2026-09-03 via ListConnectors
    cost_note: >
      Design generation and exports are covered by Kaitlyn's Canva plan;
      no separate metered cost, but respect any plan-level export/brand-kit
      limits if they come up.

  google_workspace:
    gmail: { enabled: false, chat_connector_status: "installed at org level, not enabled in this chat" }
    google_calendar: { enabled: false, chat_connector_status: "installed at org level, not enabled in this chat" }
    google_drive: { enabled: false, chat_connector_status: "installed at org level, not enabled in this chat" }
    note: >
      Deliberately deferred by Kaitlyn, not an oversight: these are
      currently personal-account connections, and she intends to connect
      this workforce to her actual work email/calendar/Drive once that's
      the right account to use. No Director should assume Gmail,
      Calendar, or Drive access, or prompt to enable them, until she
      raises it herself.

  lovable:
    enabled: true
    purpose: "UI/UX Director hands off wireframes as a live Lovable build, not just a spec"
    access_mode: "connector_only"   # no .env key path — chat-driven only
    chat_connector_status: "connected"
    cost_note: >
      Every send_message / create_project call spends Lovable workspace
      credits. Treat each one as a cost_bearing_action HITL checkpoint —
      never assumed pre-approved just because the connector is active.

  multimedia:
    google_vids: { enabled: false, note: "Manual handoff unless Workspace quota confirmed" }
    veo: { enabled: false, note: "Requires HITL approval — quota-limited" }
    elevenlabs:
      enabled: true
      access_mode: "connector_only"
      chat_connector_status: "connected"
      cost_note: >
        Free tier has a monthly character quota. Ask before generating
        (per cost_bearing_action) rather than assuming remaining quota.
    heygen_hyperframes:
      enabled: true
      access_mode: "connector_only"
      chat_connector_status: "connected"  # verified live 2026-09-03 via a real list_projects call (0 projects — empty, not broken)
      note: >
        This is "HyperFrames by HeyGen" — animated HTML slides/motion
        graphics (kinetic captions, title cards), NOT talking-avatar
        presenter video. That gap still stands as of 2026-09-03. Separately:
        from this kind of session (a CLI/IDE agent with a local
        filesystem), the connector's own `compose` and `render_video`
        tools are disabled by HeyGen's own routing — only the read tools
        (list_projects, get_project, get_project_status, get_render_status)
        work here. Actually composing/rendering requires installing the
        local HyperFrames skill (`npx skills add heygen-com/hyperframes`)
        Kaitlyn's side — say this plainly rather than attempting compose
        and reporting a spec as if it rendered.

