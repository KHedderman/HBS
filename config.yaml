# =============================================================================
# HBS AI Institute — Multi-Agent Content Command Center
# Master Configuration
# =============================================================================
# This file is the single source of truth for model assignment, cost
# governance, integrations, and the agent roster. Directors and the Chief
# of Staff read this file at boot — do not hardcode model names elsewhere.

system:
  name: "HBS AI Institute Content Command Center"
  version: "1.1.0"
  owner: "Instructional Designer & AI Product Manager, HBS AI Institute"
  architecture: "hub-and-spoke"
  communication_rule: >
    Directors never communicate with each other. Every request enters
    through the Chief of Staff (the hub), is dispatched in parallel to one
    or more Directors (the spokes), and every Director's output returns
    only to the Chief of Staff for synthesis before reaching the user.

# -----------------------------------------------------------------------------
# OPERATING MODES
# -----------------------------------------------------------------------------
# Two independent ways this system can run. They share config.yaml,
# memory/, qa_logs/, and pipelines/ — they are not separate systems.
operating_mode:
  default: interactive

  interactive:
    description: >
      The primary, current mode. You talk directly to the Chief of Staff in
      a live Claude Code chat session. Claude embodies the hub: it reads
      this file as its operating contract, routes to Director personas by
      their system prompts (agents/directors/), calls connector-based tools
      (Lovable, ElevenLabs, Granola, Notion) LIVE when they're connected,
      and asks you directly in conversation before anything cost-bearing or
      externally-published — no stdin prompts, no scripts running unattended.
    requires: "An active chat session — nothing runs when you're not here."

  unattended:
    enabled: false
    description: >
      The standalone Python system (main.py, agents/chief_of_staff.py) is
      fully built and can run headless (cron, GitHub Actions, etc.) reading
      API keys from .env instead of live chat connectors. It stays OFF
      until you deliberately turn it on.
    how_to_request: >
      To queue a specific task for unattended execution without enabling
      the whole system: ask the Chief of Staff to
      `pipelines.pipeline_tracker.PipelineTracker.queue_unattended_request()`.
      This logs the request with status "Queued — unattended mode disabled"
      and executes nothing until you explicitly flip `enabled: true` here
      (or run `main.py` yourself with a human at the keyboard to answer
      each HITL prompt, which is attended, not unattended).
    never_auto_enables: >
      No Director, no HITL "yes", and no connector action may flip this
      flag. Only you, editing this file (or asking Claude to, with an
      explicit instruction naming unattended mode), turns it on.

# -----------------------------------------------------------------------------
# COST & MODEL GOVERNANCE GUARDRAIL
# -----------------------------------------------------------------------------
# Rule: every routine must resolve to a free-tier / subscription-included
# model. If a task requires a model or tool outside this list, the system
# MUST raise a PaidTierRequiredError and route to a HITL checkpoint instead
# of silently spending money.
model_governance:
  enforce_free_tier_only: true
  default_provider: "anthropic_pro"

  approved_free_tier_models:
    anthropic_pro:
      # Included with an active Claude Pro subscription / Claude Code seat.
      # Do not substitute a paid-API-only model here.
      chat: "claude-sonnet-5"
      fast: "claude-haiku-4-5-20251001"
      reasoning: "claude-opus-5"
    google_ai_studio:
      # Google AI Studio free tier (rate-limited, no billing attached).
      chat: "gemini-2.5-flash"
      research: "gemini-2.5-pro"
    perplexity:
      # Perplexity free-tier / Pro-included web-grounded search.
      search: "sonar"
      deep_research: "sonar-reasoning"

  disallowed_without_hitl_approval:
    - "any model billed per-token outside an included subscription"
    - "any Anthropic/OpenAI/Google model call using a metered pay-as-you-go key"
    - "any third-party paid API (stock footage, paid stock TTS tiers, etc.)"
    - "ElevenLabs generation usage beyond the free character quota"
    - "Veo 3.1 / Google Vids usage beyond included Workspace/AI Studio quota"
    - "any Lovable send_message / create_project call — these spend Lovable
       workspace credits every time, connector or not. Being 'connected'
       is not the same as being free; ask before every build/edit, not
       just the first one."

  escalation_policy:
    # When a Director's task would exceed the free tier, the router pauses
    # and presents exactly this choice to the human (see hitl_checkpoints).
    # Default bias when unsure or when quota/cost is unknown: ask, don't spend.
    default_when_uncertain: "flag_for_manual_upgrade"
    on_paid_tier_required:
      - "keep_free_path"      # degrade gracefully to nearest free-tier option
      - "flag_for_manual_upgrade"  # log the request, do NOT spend, wait on user

# -----------------------------------------------------------------------------
# INTEGRATIONS
# -----------------------------------------------------------------------------
integrations:
  github:
    enabled: true
    purpose: "Persistent memory sync, PR/code sync for Product Management Director"
    repo_env_var: "GITHUB_REPO"          # e.g. "khedderman/hbs"
    token_env_var: "GITHUB_TOKEN"
    memory_path: "memory/long_term"
    fallback: "local_git_commit"          # used when no token is present

  notion:
    enabled: true
    purpose: "Long-term organizational memory, transcripts, context logs"
    access_mode: "api_key"   # unattended path
    token_env_var: "NOTION_API_KEY"
    database_id_env_var: "NOTION_MEMORY_DATABASE_ID"
    chat_connector_status: "installed, not yet connected — finish connecting for live in-chat use"

  airtable:
    enabled: true
    purpose: "Pipeline & activity tracking (initiatives, tasks, status)"
    token_env_var: "AIRTABLE_API_KEY"
    base_id_env_var: "AIRTABLE_BASE_ID"
    table_env_var: "AIRTABLE_PIPELINE_TABLE"

  perplexity:
    enabled: true
    purpose: "Web-grounded research for Market Intelligence Director"
    token_env_var: "PERPLEXITY_API_KEY"

  google_ai_studio:
    enabled: true
    purpose: "NotebookLM/Gemini ingestion for Pedagogical Synthesis Director"
    token_env_var: "GOOGLE_AI_STUDIO_API_KEY"

  granola:
    enabled: true
    purpose: >
      Meeting transcript ingestion for the Memory Curator and Pedagogical
      Synthesis Director (session facilitation notes, student feedback
      captured live, internal planning meetings).
    access_mode: "connector_only"   # no public REST API for personal accounts —
                                      # interactive chat mode only, not available
                                      # to the unattended script
    chat_connector_status: "connected"
    workflow: >
      In an interactive chat session, Claude reads a meeting via the
      Granola connector, then hands the transcript to
      MemoryCurator.ingest_external_transcript() so it's curated and
      synced like any other memory entry.

  lovable:
    enabled: true
    purpose: "UI/UX Director hands off wireframes as a live Lovable build, not just a spec"
    access_mode: "connector_only"   # no .env key path — chat-driven only
    chat_connector_status: "connected"
    cost_note: >
      Every send_message / create_project call spends Lovable workspace
      credits. Treat each one as a cost_bearing_action HITL checkpoint —
      never assumed pre-approved just because the connector is active.

  multimedia:
    google_vids: { enabled: false, note: "Manual handoff unless Workspace quota confirmed" }
    veo: { enabled: false, note: "Requires HITL approval — quota-limited" }
    elevenlabs:
      enabled: true
      access_mode: "connector_only"
      chat_connector_status: "connected"
      cost_note: >
        Free tier has a monthly character quota. Ask before generating
        (per cost_bearing_action) rather than assuming remaining quota.
    descript: { enabled: false, note: "Manual handoff by default" }

# -----------------------------------------------------------------------------
# AGENT ROSTER
# -----------------------------------------------------------------------------
agents:
  chief_of_staff:
    role: "Executive interface & Intelligent Router (Hub)"
    model: "anthropic_pro.chat"
    embodiment: >
      In interactive mode (the default), the Chief of Staff IS the live
      Claude Code chat session talking to you — not a separate process.
      Claude applies these responsibilities directly in conversation.
    responsibilities:
      - "Sole point of contact with the user"
      - "Classify intent and dispatch to one or more Directors in parallel"
      - "Query the Memory Curator before every routing decision"
      - "Synthesize Director outputs into one unified response"
      - "Enforce HITL checkpoints before any cost-bearing or high-stakes action"
      - "Ask before spending — every time a connector call has a real cost, not just the first time"

  memory_curator:
    role: "Persistent context engine (Core Pillar)"
    model: "anthropic_pro.fast"
    responsibilities:
      - "Curate and store session transcripts and structured knowledge"
      - "Ingest external transcripts (e.g. Granola meeting notes) via ingest_external_transcript()"
      - "Sync memory to GitHub (memory/long_term) and Notion"
      - "Serve recall() queries to the Chief of Staff and Directors"

  directors:
    - id: market_intelligence
      title: "Director of AI Market & Executive Intelligence"
      model: "perplexity.deep_research"
      domains: [ai_market_tracking, executive_briefings, workforce_transformation]

    - id: pedagogical_synthesis
      title: "Director of Pedagogical Synthesis & Instructional Design"
      model: "google_ai_studio.research"
      frameworks: [andragogy, udl, cognitive_load_theory, case_method_design]
      domains: [course_drafting, session_facilitation_guides, student_success_tracking, granola_meeting_ingestion]

    - id: product_management
      title: "Director of AI Product Management & Development"
      model: "anthropic_pro.reasoning"
      domains: [feature_ideation, prd_generation, technical_architecture, qa_review, github_sync]

    - id: project_management
      title: "Director of Project Management & Cross-Functional Operations"
      model: "anthropic_pro.fast"
      domains: [timelines, task_routing, airtable_sync, notion_sync]

    - id: ui_ux_architecture
      title: "Director of Interactive UI/UX Architecture"
      model: "anthropic_pro.chat"
      domains: [wireframes, component_specs, lovable_handoff, lovable_live_build]
      note: "With the Lovable connector active, produces a live build via mcp__Lovable__* — gated per cost_bearing_action, not just a spec"

    - id: growth_content
      title: "Director of Growth & Omnichannel Content"
      model: "anthropic_pro.chat"
      domains: [linkedin, newsletter, instagram, content_recycling, growth_strategy]

    - id: multimedia_production
      title: "Director of Multimedia Production"
      model: "anthropic_pro.chat"
      domains: [video_orchestration, voice, avatars, kinetic_captions]
      note: "With the ElevenLabs connector active, can generate real audio/voice assets via mcp__ElevenLabs__* — gated per cost_bearing_action every time, not just past quota"

    - id: analytics_reporting
      title: "Director of Analytics & Leadership Reporting"
      model: "anthropic_pro.reasoning"
      domains: [feedback_analysis, telemetry, iteration_suggestions, leadership_reports]

    - id: accessibility_compliance
      title: "Director of Accessibility & Compliance"
      model: "anthropic_pro.fast"
      domains: [udl_audit, reading_level_audit, cognitive_load_audit]

# -----------------------------------------------------------------------------
# HUMAN-IN-THE-LOOP CHECKPOINTS
# -----------------------------------------------------------------------------
hitl_checkpoints:
  - id: strategic_approval
    trigger: "Any output that commits HBS AI Institute to a public position, partnership, or curriculum change"
    action: "block_until_approved"

  - id: pedagogical_review
    trigger: "Any course content, facilitation guide, or student-facing material before publication"
    action: "block_until_approved"

  - id: cost_bearing_action
    trigger: "Any Director request that would exceed an approved free-tier / included quota"
    action: "present_choice"
    choices: ["keep_free_path", "flag_for_manual_upgrade"]

  - id: external_publish
    trigger: "Any action that posts externally (LinkedIn, Instagram, GitHub PR merge, Notion publish)"
    action: "block_until_approved"

logging:
  qa_logs_dir: "qa_logs"
  routing_log: "qa_logs/routing_log.jsonl"
  hitl_decision_log: "qa_logs/hitl_decision_log.jsonl"
  outputs_dir: "outputs"
