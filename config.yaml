      version_control_mechanism: >
        Corrected 2026-09-03: "version control and QA" was a stated
        responsibility with no real mechanism anywhere in the repo — the
        outputs/ directory this file's logging.outputs_dir points to
        existed but was never actually used. The real mechanism, using
