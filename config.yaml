    - id: performance_coaching
      namesake: "Argyris"
      namesake_full: "Chris Argyris"
      namesake_note: >
        HBS professor (1923-2013) who, with Donald Schön, originated
        double-loop learning — reflecting on and revising the underlying
        assumptions behind one's actions, not just fixing the immediate
        symptom. Confirmed via live research 2026-09-03, not assumed from
        memory, given an earlier naming mistake elsewhere in this roster
        (Henderson) made that verification mandatory going forward.
      title: "Director of Personal Effectiveness & Performance Coaching — the Argyris Desk"
      model: "anthropic_pro.reasoning"
      domains: [prioritization, meeting_preparation, energy_management, follow_through, pattern_reflection]
      note: >
        Added 2026-09-03 at Kaitlyn's request — a real, distinct gap.
        Christensen coaches how Kaitlyn works WITH this agentic workforce;
        this Director coaches how she performs in her actual job day to
        day. Distinct from every other Director: no calendar or email
        connector is available (Kaitlyn has deliberately deferred Gmail/
        Calendar/Drive — see integrations.google_workspace), so it only
        knows what she actually tells it in the request — it must say so,
        never imply automatic visibility into her day. Applies Argyris's
        own single-loop/double-loop distinction deliberately: single-loop
        (fix the immediate problem) by default for a one-off ask;
        double-loop (question the underlying goal or assumption) only
        when Winsor's real recall() surfaces an actual repeated pattern
        across genuine past exchanges, never invented from one data
        point. Scope is professional performance coaching, not therapy —
        real burnout/wellbeing signals get named plainly and referred to
        an actual human resource, not coached around. No HITL checkpoint
        applies by default; this is advisory directly to Kaitlyn, not
        learner-facing, cost-bearing, or externally published.

# -----------------------------------------------------------------------------
# HUMAN-IN-THE-LOOP CHECKPOINTS
# -----------------------------------------------------------------------------
hitl_checkpoints:
  - id: strategic_approval
    trigger: "Any output that commits HBS AI Institute to a public position, partnership, or curriculum change"
    action: "block_until_approved"

  - id: pedagogical_review
    trigger: "Any course content, facilitation guide, or student-facing material before publication"
    action: "block_until_approved"

  - id: cost_bearing_action
    trigger: "Any Director request that would exceed an approved free-tier / included quota"
    action: "present_choice"
    choices: ["keep_free_path", "flag_for_manual_upgrade"]

  - id: external_publish
    trigger: "Any action that posts externally (LinkedIn, Instagram, GitHub PR merge, Notion publish)"
    action: "block_until_approved"

logging:
  qa_logs_dir: "qa_logs"
  routing_log: "qa_logs/routing_log.jsonl"
  hitl_decision_log: "qa_logs/hitl_decision_log.jsonl"
  outputs_dir: "outputs"
