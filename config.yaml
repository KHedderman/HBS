      namesake: "Doriot"
      namesake_full: "Georges Doriot"
      namesake_note: "HBS professor, founded the first modern VC firm (ARDC) to spot and fund emerging technology."
      title: "Director of AI Market & Executive Intelligence — the Doriot Desk"
      model: "anthropic_pro.chat"  # corrected 2026-09-03: matches the real .claude/agents/doriot.md subagent (Sonnet).
      research_connector: "perplexity.deep_research"  # optional enrichment when the Perplexity connector/key is actually available — not the base model.
      domains: [new_ai_products_and_capabilities, business_and_industry_impact, harvard_and_academic_ai_research, executive_briefings, workforce_transformation]
      note: >
        Scope is new AI products/capability releases, business and industry
        developments that matter to executives, and academic AI research out
        of Harvard and other institutions — not competitive intelligence.

    - id: pedagogical_synthesis
      namesake: "Donham"
      namesake_full: "Wallace B. Donham"
      namesake_note: "HBS's second dean — institutionalized the case method as HBS's core pedagogy."
      title: "Director of Pedagogical Synthesis & Instructional Design — the Donham Desk"
      model: "anthropic_pro.chat"  # corrected 2026-09-03: matches the real .claude/agents/donham.md subagent (Sonnet).
      research_connector: "google_ai_studio.research"  # optional NotebookLM/Gemini ingestion when that key is actually configured — not the base model.
      frameworks: [andragogy, udl, cognitive_load_theory, case_method_design,
        addie, sam_model, backward_design, gagnes_nine_events, blooms_taxonomy,
        kirkpatricks_four_levels, merrills_first_principles, kolbs_experiential_cycle,
        seventy_twenty_ten, community_of_inquiry]
      delivery_media: [self_paced_digital_module, synchronous_virtual, in_person, hybrid_blended]
      proficiency_axes:
        ai_fluency: [novice, practitioner, advanced, expert]
        organizational_altitude: [individual_contributor, functional_manager, senior_leader, c_suite_or_board]
      domains: [course_drafting, digital_module_lessons, session_facilitation_guides, student_success_tracking, granola_meeting_ingestion, accessibility_by_design, assessment_and_evaluation_design]
      expansion_note: >
