# =============================================================================
# HBS AI Institute — Multi-Agent Content Command Center
# Master Configuration
# =============================================================================
# This file is the single source of truth for model assignment, cost
# governance, integrations, and the agent roster. Directors and the Chief
# of Staff read this file at boot — do not hardcode model names elsewhere.

system:
  name: "HBS AI Institute Content Command Center"
  version: "1.2.0"
  owner: "Instructional Designer & AI Product Manager, HBS AI Institute"
  architecture: "hub-and-spoke"
  communication_rule: >
    Directors never communicate with each other. Every request enters
    through the Chief of Staff (the hub), is dispatched in parallel to one
    or more Directors (the spokes), and every Director's output returns
    only to the Chief of Staff for synthesis before reaching the user.
  naming_convention: >
    Every hub-and-spoke role carries a real Harvard namesake alongside its
    functional title, chosen to fit what the role does — never merely
    decorative, and never a contested or living figure. The two hub-level
    roles (Chief of Staff, Memory Curator) take UNIVERSITY-wide figures,
    since they coordinate across everything below them; the eleven Directors
    take HBS-specific figures, since each owns one bounded domain. One
    Director (Accessibility & Compliance) intentionally carries no
    namesake — UDL/WCAG are modern frameworks with no real historical
    figure behind them, and forcing one on would trivialize it.

# -----------------------------------------------------------------------------
# OPERATING MODES
# -----------------------------------------------------------------------------
# Two independent ways this system can run. They share config.yaml,
# memory/, qa_logs/, and pipelines/ — they are not separate systems.
operating_mode:
  default: interactive

  interactive:
    description: >
      The primary, current mode. You talk directly to the Chief of Staff in
      a live Claude Code chat session. Claude embodies the hub: it reads
      this file as its operating contract, routes to Director personas by
      their system prompts (agents/directors/), calls connector-based tools
      (Lovable, ElevenLabs, Granola, Notion) LIVE when they're connected,
      and asks you directly in conversation before anything cost-bearing or
      externally-published — no stdin prompts, no scripts running unattended.
    requires: "An active chat session — nothing runs when you're not here."

  unattended:
    enabled: false
    description: >
      The standalone Python system (main.py, agents/chief_of_staff.py) is
      fully built and can run headless (cron, GitHub Actions, etc.) reading
      API keys from .env instead of live chat connectors. It stays OFF
      until you deliberately turn it on.
    how_to_request: >
      To queue a specific task for unattended execution without enabling
      the whole system: ask the Chief of Staff to
      `pipelines.pipeline_tracker.PipelineTracker.queue_unattended_request()`.
      This logs the request with status "Queued — unattended mode disabled"
      and executes nothing until you explicitly flip `enabled: true` here
      (or run `main.py` yourself with a human at the keyboard to answer
      each HITL prompt, which is attended, not unattended).
    never_auto_enables: >
      No Director, no HITL "yes", and no connector action may flip this
      flag. Only you, editing this file (or asking Claude to, with an
      explicit instruction naming unattended mode), turns it on.

# -----------------------------------------------------------------------------
# COST & MODEL GOVERNANCE GUARDRAIL
# -----------------------------------------------------------------------------
# Rule: every routine must resolve to a free-tier / subscription-included
# model. If a task requires a model or tool outside this list, the system
# MUST raise a PaidTierRequiredError and route to a HITL checkpoint instead
# of silently spending money.
model_governance:
  enforce_free_tier_only: true
  default_provider: "anthropic_pro"

  approved_free_tier_models:
    anthropic_pro:
      # CORRECTION (was mislabeled): these model IDs are what the
      # STANDALONE SCRIPT calls via ANTHROPIC_API_KEY and the `anthropic`
      # Python SDK — that is Anthropic's metered, pay-per-token Developer
      # API (console.anthropic.com billing), NOT covered by a claude.ai
      # Pro/Max seat. A Pro/Max subscription has no portable API key at
      # all. Talking to Eliot in a live Claude Code chat, and using The
      # Docket's `sample` capability, both use your existing Claude
      # access directly and need NO key here — this section only matters
      # if you deliberately want the standalone script to make real
      # (billed) calls instead of its default offline stub responses.
      chat: "claude-sonnet-5"
      fast: "claude-haiku-4-5-20251001"
      reasoning: "claude-opus-5"
    google_ai_studio:
      # Genuinely free: aistudio.google.com/apikey issues a rate-limited
      # key with no billing attached unless you separately enable billing.
      chat: "gemini-2.5-flash"
      research: "gemini-2.5-pro"
    perplexity:
      # NOT reliably free: Perplexity's API is a metered product.
      # Perplexity Pro has historically included a small monthly API
      # credit, but that's a Perplexity policy that can change — verify
      # current terms on their site before assuming any usage is covered.
      search: "sonar"
      deep_research: "sonar-reasoning"

  disallowed_without_hitl_approval:
    - "any model billed per-token outside an included subscription"
    - "any Anthropic/OpenAI/Google model call using a metered pay-as-you-go key"
    - "any third-party paid API (stock footage, paid stock TTS tiers, etc.)"
    - "ElevenLabs generation usage beyond the free character quota"
    - "Veo 3.1 / Google Vids usage beyond included Workspace/AI Studio quota"
    - "any Lovable send_message / create_project call — these spend Lovable
       workspace credits every time, connector or not. Being 'connected'
       is not the same as being free; ask before every build/edit, not
       just the first one."

  escalation_policy:
    # When a Director's task would exceed the free tier, the router pauses
    # and presents exactly this choice to the human (see hitl_checkpoints).
    # Default bias when unsure or when quota/cost is unknown: ask, don't spend.
    default_when_uncertain: "flag_for_manual_upgrade"
    on_paid_tier_required:
      - "keep_free_path"      # degrade gracefully to nearest free-tier option
      - "flag_for_manual_upgrade"  # log the request, do NOT spend, wait on user

# -----------------------------------------------------------------------------
# INTEGRATIONS
# -----------------------------------------------------------------------------
integrations:
  github:
    enabled: true
    purpose: "Persistent memory sync, PR/code sync for Product Management Director"
    repo_env_var: "GITHUB_REPO"          # e.g. "khedderman/hbs"
    token_env_var: "GITHUB_TOKEN"
    memory_path: "memory/long_term"
    fallback: "local_git_commit"          # used when no token is present

  notion:
    enabled: true
    purpose: "Long-term organizational memory, transcripts, context logs"
    access_mode: "api_key"   # unattended path
    token_env_var: "NOTION_API_KEY"
    database_id_env_var: "NOTION_MEMORY_DATABASE_ID"
    chat_connector_status: "connected"  # verified live 2026-09-03 via ListConnectors

  airtable:
    enabled: true
    purpose: "Pipeline & activity tracking (initiatives, tasks, status)"
    token_env_var: "AIRTABLE_API_KEY"
    base_id_env_var: "AIRTABLE_BASE_ID"
    table_env_var: "AIRTABLE_PIPELINE_TABLE"

  perplexity:
    enabled: true
    purpose: "Web-grounded research for Market Intelligence Director"
    token_env_var: "PERPLEXITY_API_KEY"

  google_ai_studio:
    enabled: true
    purpose: "NotebookLM/Gemini ingestion for Pedagogical Synthesis Director"
    token_env_var: "GOOGLE_AI_STUDIO_API_KEY"

  granola:
    enabled: true
    purpose: >
      Meeting transcript ingestion for the Memory Curator and Pedagogical
      Synthesis Director (session facilitation notes, student feedback
      captured live, internal planning meetings).
    access_mode: "connector_only"   # no public REST API for personal accounts —
                                      # interactive chat mode only, not available
                                      # to the unattended script
    chat_connector_status: "connected"
    workflow: >
      In an interactive chat session, Claude reads a meeting via the
      Granola connector, then hands the transcript to
      MemoryCurator.ingest_external_transcript() so it's curated and
      synced like any other memory entry.

  canva:
    enabled: true
    purpose: "Real design generation — decks, infographics, toolkits, one-pagers — for the Content Conversion & Production Director"
    access_mode: "connector_only"
    chat_connector_status: "connected"  # verified live 2026-09-03 via ListConnectors
    cost_note: >
      Design generation and exports are covered by Kaitlyn's Canva plan;
      no separate metered cost, but respect any plan-level export/brand-kit
      limits if they come up.

  google_workspace:
    gmail: { enabled: false, chat_connector_status: "installed at org level, not enabled in this chat" }
    google_calendar: { enabled: false, chat_connector_status: "installed at org level, not enabled in this chat" }
    google_drive: { enabled: false, chat_connector_status: "installed at org level, not enabled in this chat" }
    note: >
      Deliberately deferred by Kaitlyn, not an oversight: these are
      currently personal-account connections, and she intends to connect
      this workforce to her actual work email/calendar/Drive once that's
      the right account to use. No Director should assume Gmail,
      Calendar, or Drive access, or prompt to enable them, until she
      raises it herself.

  lovable:
    enabled: true
    purpose: "UI/UX Director hands off wireframes as a live Lovable build, not just a spec"
    access_mode: "connector_only"   # no .env key path — chat-driven only
    chat_connector_status: "connected"
    cost_note: >
      Every send_message / create_project call spends Lovable workspace
      credits. Treat each one as a cost_bearing_action HITL checkpoint —
      never assumed pre-approved just because the connector is active.

  multimedia:
    google_vids: { enabled: false, note: "Manual handoff unless Workspace quota confirmed" }
    veo: { enabled: false, note: "Requires HITL approval — quota-limited" }
    elevenlabs:
      enabled: true
      access_mode: "connector_only"
      chat_connector_status: "connected"
      cost_note: >
        Free tier has a monthly character quota. Ask before generating
        (per cost_bearing_action) rather than assuming remaining quota.
    descript: { enabled: false, note: "Manual handoff by default" }

# -----------------------------------------------------------------------------
# AGENT ROSTER
# -----------------------------------------------------------------------------
agents:
  chief_of_staff:
    namesake: "Eliot"
    namesake_full: "Charles William Eliot"
    namesake_note: >
      Harvard's longest-serving president (1869–1909) — built the
      coordinating structure that let Harvard's separate schools function
      as one university. Exactly the hub's job: one executive view across
      everything underneath it.
    role: "Eliot — Chief of Staff & Intelligent Router (Hub)"
    model: "anthropic_pro.chat"
    embodiment: >
      In interactive mode (the default), the Chief of Staff IS the live
      Claude Code chat session talking to you — not a separate process.
      Claude applies these responsibilities directly in conversation.
    responsibilities:
      - "Sole point of contact with the user"
      - "Classify intent and dispatch to one or more Directors in parallel"
      - "Query the Memory Curator before every routing decision"
      - "Synthesize Director outputs into one unified response"
      - "Enforce HITL checkpoints before any cost-bearing or high-stakes action"
      - "Ask before spending — every time a connector call has a real cost, not just the first time"

  memory_curator:
    namesake: "Winsor"
    namesake_full: "Justin Winsor"
    namesake_note: >
      Harvard's University Librarian (1877–1897) and a founding figure of
      American librarianship — built the systems for organizing and
      preserving the university's collective knowledge.
    role: "Winsor — Memory Curator & Governance/Reporting (Core Pillar)"
    model: "anthropic_pro.fast"
    responsibilities:
      - "Curate and store session transcripts and structured knowledge"
      - "Ingest external transcripts (e.g. Granola meeting notes) via ingest_external_transcript()"
      - "Sync memory to GitHub (memory/long_term) and Notion"
      - "Serve recall() queries to the Chief of Staff and Directors"
      - "Own governance and reporting: read back across the HITL decision log and produce governance_digest() — pending/approved/denied checkpoints and recent activity — not just passive storage"
      - "Publish the governance digest to Notion as a real, standing artifact via publish_governance_digest()"

  directors:
    - id: market_intelligence
      namesake: "Doriot"
      namesake_full: "Georges Doriot"
      namesake_note: "HBS professor, founded the first modern VC firm (ARDC) to spot and fund emerging technology."
      title: "Director of AI Market & Executive Intelligence — the Doriot Desk"
      model: "anthropic_pro.chat"  # corrected 2026-09-03: matches the real .claude/agents/doriot.md subagent (Sonnet).
      research_connector: "perplexity.deep_research"  # optional enrichment when the Perplexity connector/key is actually available — not the base model.
      domains: [new_ai_products_and_capabilities, business_and_industry_impact, harvard_and_academic_ai_research, executive_briefings, workforce_transformation]
      note: >
        Scope is new AI products/capability releases, business and industry
        developments that matter to executives, and academic AI research out
        of Harvard and other institutions — not competitive intelligence.

    - id: pedagogical_synthesis
      namesake: "Donham"
      namesake_full: "Wallace B. Donham"
      namesake_note: "HBS's second dean — institutionalized the case method as HBS's core pedagogy."
      title: "Director of Pedagogical Synthesis & Instructional Design — the Donham Desk"
      model: "anthropic_pro.chat"  # corrected 2026-09-03: matches the real .claude/agents/donham.md subagent (Sonnet).
      research_connector: "google_ai_studio.research"  # optional NotebookLM/Gemini ingestion when that key is actually configured — not the base model.
      frameworks: [andragogy, udl, cognitive_load_theory, case_method_design]
      domains: [course_drafting, digital_module_lessons, session_facilitation_guides, student_success_tracking, granola_meeting_ingestion]

    - id: product_management
      namesake: "Aiken"
      namesake_full: "Howard Aiken"
      namesake_note: "Harvard professor who built the Harvard Mark I — a real builder/engineer pedigree."
      title: "Director of AI Product Management & Development — the Aiken Desk"
      model: "anthropic_pro.reasoning"
      domains: [feature_ideation, prd_generation, technical_architecture, qa_review, github_sync]

    - id: project_management
      namesake: "Taylor"
      namesake_full: "Frederick Winslow Taylor"
      namesake_note: "Gave HBS's first operations/'scientific management' course in 1909."
      title: "Director of Project Management & Cross-Functional Operations — the Taylor Desk"
      model: "anthropic_pro.fast"
      domains: [timelines, task_routing, airtable_sync, notion_sync, sop_development, virtual_program_management, in_person_event_support, institute_scaling_projects]

    - id: ui_ux_architecture
      namesake: "Gropius"
      namesake_full: "Walter Gropius"
      namesake_note: "Harvard GSD, Bauhaus founder — an actual architecture pioneer, cross-school pun intended."
      title: "Director of Interactive UI/UX Architecture — the Gropius Desk"
      model: "anthropic_pro.chat"
      domains: [wireframes, component_specs, lovable_handoff, lovable_live_build]
      note: "With the Lovable connector active, produces a live build via mcp__Lovable__* — gated per cost_bearing_action, not just a spec"

    - id: growth_content
      namesake: "Levitt"
      namesake_full: "Theodore Levitt"
      namesake_note: "HBS marketing professor, wrote 'Marketing Myopia' — a founding voice of modern marketing strategy."
      title: "Director of Growth & Omnichannel Content — the Levitt Desk"
      model: "anthropic_pro.chat"
      domains: [linkedin, newsletter, instagram, content_recycling, growth_strategy]

    - id: multimedia_production
      namesake: "Land"
      namesake_full: "Edwin Land"
      namesake_note: "Attended Harvard, founded Polaroid — real visual-media-technology pedigree."
      title: "Director of Multimedia Production — the Land Desk"
      model: "anthropic_pro.chat"
      domains: [video_orchestration, voice, avatars, kinetic_captions, video_generation, video_editing, audio_editing, podcast_production]
      tools: [elevenlabs]
      aspirational_tools: [replicate, heygen]
      note: >
        Corrected 2026-09-03: only ElevenLabs is a real, connected tool —
        verified live, and its mcp__ElevenLabs__* creative_* tools already
        cover image/video/speech generation and editing, not just audio.
        `replicate` and `heygen` were declared here but neither has an
        installable connector in this org's registry (checked via
        SearchMcpRegistry): there is no plain "Replicate" connector, and
        the only HeyGen-named listing, "HyperFrames by HeyGen", builds
        animated HTML slides/motion graphics — not talking-avatar
        presenter video. Until a real avatar/presenter tool is confirmed
        available, treat avatar/presenter video as a genuine roster gap,
        not a connected capability — say so plainly rather than implying
        HeyGen ran.

    - id: analytics_reporting
      namesake: "Henderson"
      namesake_full: "Bruce Henderson"
      namesake_note: "HBS MBA, founded BCG, invented the growth-share matrix — analytics into strategy."
      title: "Director of Analytics & Leadership Reporting — the Henderson Desk"
      model: "anthropic_pro.reasoning"
      domains: [feedback_analysis, telemetry, iteration_suggestions, leadership_reports]
      instrument: "metrics/learning_metrics.jsonl"  # real, in-repo — see metrics/README.md
      note: >
        Corrected 2026-09-03: this Director had a system_prompt and no
        data connector, schema, or storage at all — genuinely conceptual.
        metrics/learning_metrics.jsonl is a real, in-repo starting
        instrument (no new connector required) so there's something to
        actually read and report on. The 5 draft metrics it proposes are
        Kaitlyn's placeholder, not confirmed HBS AI Institute measures —
        public research couldn't establish what the Institute actually
        tracks, so this needs verifying with the hiring manager, not
        presented in the interview as settled. If a real survey/analytics
        connector (e.g. SurveyMonkey, Smartsheet) is wanted later, that's
        a deliberate connector-install decision for Kaitlyn to make, not
        one to assume or install unprompted.

    - id: accessibility_compliance
      namesake: null
      namesake_note: "Intentionally unnamed — see naming_convention above."
      title: "Director of Accessibility & Compliance"
      model: "anthropic_pro.fast"
      domains: [udl_audit, reading_level_audit, cognitive_load_audit]

    - id: content_production
      namesake: "Copeland"
      namesake_full: "Melvin T. Copeland"
      namesake_note: >
        Credited with writing HBS's first course-method case (1921) —
        formalized converting raw research into a usable teaching asset.
      title: "Director of Content Conversion & Production — the Copeland Desk"
      model: "anthropic_pro.chat"
      tools: [canva]
      domains: [research_to_asset_conversion, facilitation_decks, toolkits, infographics, blog_posts, version_control, qa_release_process]
      note: >
        Added to cover the job description's "Content Conversion and
        Production" responsibilities, which weren't cleanly owned by
        Donham (pedagogical frameworks), Levitt (external growth
        marketing), or Land (video/audio) — this Director takes existing
        research/materials and turns them into a specific, released,
        version-controlled deliverable.
      version_control_mechanism: >
        Corrected 2026-09-03: "version control and QA" was a stated
        responsibility with no real mechanism anywhere in the repo — the
        outputs/ directory this file's logging.outputs_dir points to
        existed but was never actually used. The real mechanism, using
        infrastructure already connected and verified (GitHub): every
        released asset gets committed to outputs/<date>-<slug>/ with the
        rendered file(s) plus a short README recording the source
        material converted from, the target format, the QA pass applied,
        and the version number — then pushed. That commit history IS the
        version control; no separate tool is needed. Nothing here is real
        until at least one asset has actually gone through this path.

    - id: innovation_advisory
      namesake: "Christensen"
      namesake_full: "Clayton Christensen"
      namesake_note: >
        HBS professor and author of "The Innovator's Dilemma" — the
        foundational scholar on how organizations should recognize and
        adopt disruptive technology rather than be displaced by it.
      title: "Director of Innovation & Continuous Improvement — the Christensen Desk"
      model: "anthropic_pro.reasoning"
      domains: [usage_pattern_analysis, tool_adoption_scouting, role_refinement, practice_coaching, organizational_change_management]
      note: >
        Distinct from every other Director: its subject is the workforce
        itself and Kaitlyn's own practice with it, not a task deliverable
        for an external audience. Reads Winsor's recalled context and the
        roster above, then recommends new AI tools/connectors worth
        adopting, refinements to an existing Director's scope or tooling,
        coaching for how Kaitlyn works with the system, and adoption
        material for colleagues standing up their own agentic workforce —
        People, Process, and Product.

# -----------------------------------------------------------------------------
# HUMAN-IN-THE-LOOP CHECKPOINTS
# -----------------------------------------------------------------------------
hitl_checkpoints:
  - id: strategic_approval
    trigger: "Any output that commits HBS AI Institute to a public position, partnership, or curriculum change"
    action: "block_until_approved"

  - id: pedagogical_review
    trigger: "Any course content, facilitation guide, or student-facing material before publication"
    action: "block_until_approved"

  - id: cost_bearing_action
    trigger: "Any Director request that would exceed an approved free-tier / included quota"
    action: "present_choice"
    choices: ["keep_free_path", "flag_for_manual_upgrade"]

  - id: external_publish
    trigger: "Any action that posts externally (LinkedIn, Instagram, GitHub PR merge, Notion publish)"
    action: "block_until_approved"

logging:
  qa_logs_dir: "qa_logs"
  routing_log: "qa_logs/routing_log.jsonl"
  hitl_decision_log: "qa_logs/hitl_decision_log.jsonl"
  outputs_dir: "outputs"
